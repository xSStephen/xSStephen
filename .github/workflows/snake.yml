name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xSStephen
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=6366F1&color_dots=#e2e8f0,#94a3b8,#00D9FF,#6366F1,#A855F7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=6366F1&color_dots=#0F172A,#1e293b,#00D9FF,#6366F1,#A855F7

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: dist/*
